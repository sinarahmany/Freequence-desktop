name: Flatpak Build & Flathub Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Freequence.flatpak
          manifest-path: io.github.sinarahmany.Freequence.yml
          run-tests: false
          cache: false

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Freequence-flatpak
          path: Freequence.flatpak
