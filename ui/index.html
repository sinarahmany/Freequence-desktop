<!doctype html>
<!-- The dark class is set here rather than at runtime so there is no flash of a
     light background before React mounts. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the player bar pad itself out of the way of the
         home indicator on notched phones via env(safe-area-inset-bottom). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Freequence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
